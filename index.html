<body>
<main class="page">
  <header class="hero"><img id="heroImg" alt="Logo ISIA MOTION" src="assets/bg2.jpg"></header>
  <div class="inner">
    <div class="ident">
      <h1 id="name">ISIA MOTION</h1>
      <p class="tag" id="tag"></p>
      <div class="rule"></div>
    </div>
    <nav class="cards" id="cards" aria-label="Links da loja"></nav>

  </div>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  var CACHE = 'isia-cache-v1';
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE)); } catch (e) {}
  /* Mostra na hora o último conteúdo conhecido; depois confere no banco. */
  ISIA.renderPage(ISIA.normalize(cached));

  var sb = ISIA.client();
  if (!sb) return;
  sb.from('pagina').select('dados').eq('id', 1).maybeSingle().then(function (r) {
    if (r.error || !r.data || !r.data.dados) return;
    var s = ISIA.normalize(r.data.dados);
    ISIA.renderPage(s);
    try { localStorage.setItem(CACHE, JSON.stringify(s)); } catch (e) {}
  });
})();
</script>
</body>
